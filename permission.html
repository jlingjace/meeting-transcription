<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Meet Transcript — 麦克风授权</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 32px 28px;
      max-width: 520px;
      margin: 24px auto;
      background: #f8f9fa;
      color: #1f2937;
      line-height: 1.6;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #4b5563; font-size: 14px; }
    ul { font-size: 13px; color: #6b7280; padding-left: 20px; }
    .btn {
      margin-top: 16px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .btn:hover { opacity: .9; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    .status.ok  { background: #d1fae5; color: #065f46; }
    .status.err { background: #fee2e2; color: #991b1b; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Meet Transcript 麦克风授权</h1>
    <p>为了完整转录会议（包含<b>你自己说的话</b>），扩展需要访问麦克风。</p>
    <ul>
      <li>Tab 音频：自动捕获远端参会者的声音</li>
      <li>麦克风：捕获你自己说的话（需要授权）</li>
    </ul>
    <p>授权一次即可，后续录音无需再次确认。所有音频在本地处理，不上传任何服务器。</p>
    <button class="btn" id="grant">授权麦克风访问</button>
    <div id="status"></div>
    <div class="hint">如果误点了"拒绝"，请在地址栏左侧的锁图标里手动恢复，或重新加载这个页面。</div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
