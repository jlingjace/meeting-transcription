<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
    background: #f8f9fa; color: #333;
  }
  #header {
    padding: 14px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; flex-shrink: 0;
  }
  #title { font-weight: 600; font-size: 15px; }
  #status {
    margin-top: 8px; font-size: 11px; padding: 4px 8px; border-radius: 6px;
    background: rgba(255,255,255,.15); display: inline-flex; align-items: center; gap: 5px;
    color: rgba(255,255,255,.9);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.45); flex-shrink: 0; }
  .dot.recording { background: #f87171; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  #record-bar { padding: 10px 12px; border-bottom: 1px solid #eee; background: #fff; flex-shrink: 0; }
  #btn-record {
    width: 100%; padding: 10px 0; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid #a5b4fc; background: #eef2ff; color: #4338ca; transition: background .15s;
  }
  #btn-record.recording { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
  #btn-record:hover { filter: brightness(.97); }

  #model-bar { display:none; padding:8px 12px; background:#eff6ff; border-bottom:1px solid #bfdbfe; flex-shrink:0; }
  #model-label { font-size:11px; color:#1e40af; margin-bottom:5px; }
  #model-track { height:4px; background:#dbeafe; border-radius:2px; overflow:hidden; }
  #model-fill { height:100%; background:#3b82f6; width:0%; transition:width .3s; }

  #list { flex: 1; overflow-y: auto; padding: 12px; }
  #list::-webkit-scrollbar { width: 6px; }
  #list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .bubble { background: #fff; border: 1px solid #e9ecef; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .bubble-ts { font-size: 11px; color: #999; margin-bottom: 4px; }
  .bubble-text { font-size: 13px; line-height: 1.55; }
  .empty { color: #aaa; text-align: center; padding: 32px 16px; font-size: 13px; line-height: 1.7; }
  .warn { background:#fff3cd; border:1px solid #ffc107; border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:12px; color:#856404; }

  #footer { padding: 10px 12px; display: flex; gap: 8px; border-top: 1px solid #eee; background: #fff; flex-shrink: 0; }
  .btn { flex: 1; padding: 8px 0; border: 1px solid #e2e6ea; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; background: #f8f9fa; color: #495057; }
  .btn:hover { background: #e9ecef; }
  .btn.danger { color: #dc3545; border-color: #f5c6cb; }

  details#debug { font-size:10px; background:#1e1e1e; color:#a8ff78; padding:6px 10px; flex-shrink:0; max-height:120px; overflow:auto; }
  details#debug summary { cursor:pointer; color:#888; user-select:none; }
  #debug-content { margin:4px 0 0; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
  <div id="header">
    <div id="title">Live Transcript</div>
    <div id="status"><span class="dot" id="dot"></span><span id="status-text">就绪</span></div>
  </div>

  <div id="record-bar">
    <button id="btn-record">● 开始转录当前标签页</button>
  </div>

  <div id="model-bar">
    <div id="model-label">⏳ 加载语音模型...</div>
    <div id="model-track"><div id="model-fill"></div></div>
  </div>

  <div id="list"></div>

  <div id="footer">
    <button class="btn" id="copy">复制</button>
    <button class="btn danger" id="clear">清空</button>
    <button class="btn" id="download">下载</button>
  </div>

  <details id="debug">
    <summary>调试日志</summary>
    <pre id="debug-content"></pre>
  </details>

  <script src="sidepanel.js"></script>
</body>
</html>
